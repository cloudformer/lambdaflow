[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lambdaflow"
version = "0.1.0"
description = "A truly serverless Airflow on your own AWS account: Airflow 3 DAG files on Lambda, Step Functions, EventBridge Scheduler and DynamoDB, ≈ $0 when idle. Python client for the deployment."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frank Zhang" }]
keywords = ["serverless", "aws", "lambda", "airflow", "mwaa", "step-functions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []  # standard library only

[project.urls]
Homepage = "https://github.com/cloudformer/lambdaflow"
Repository = "https://github.com/cloudformer/lambdaflow"
Deploy = "https://github.com/cloudformer/lambdaflow#quick-start"
Compatibility = "https://github.com/cloudformer/lambdaflow/blob/main/tests/compat/REPORT.md"
Changelog = "https://github.com/cloudformer/lambdaflow/blob/main/CHANGELOG.md"
Issues = "https://github.com/cloudformer/lambdaflow/issues"

[tool.setuptools]
packages = ["lambdaflow"]
