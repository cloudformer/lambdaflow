<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gCompute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F58534"/><stop offset="1" stop-color="#C7511F"/>
    </linearGradient>
    <linearGradient id="gStorage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CAE3E"/><stop offset="1" stop-color="#3F8624"/>
    </linearGradient>
    <linearGradient id="gFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7157B"/><stop offset="1" stop-color="#B0084D"/>
    </linearGradient>
    <linearGradient id="gDb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D72F3"/><stop offset="1" stop-color="#3334B9"/>
    </linearGradient>
    <linearGradient id="gConsole" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8C4FFF"/><stop offset="1" stop-color="#5B3BC8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CBD5E1"/>
    </marker>
    <style>
      .group  { fill: none; stroke: #94A3B8; stroke-width: 1.3; }
      .gtitle { font-size: 15px; font-weight: 600; fill: #CBD5E1; }
      .label  { font-size: 12.5px; font-weight: 600; fill: #F1F5F9; }
      .sub    { font-size: 11px; fill: #94A3B8; }
      .edge   { fill: none; stroke: #CBD5E1; stroke-width: 1.8; }
      .callout      { fill: #F2443B; }
      .callout-text { font-size: 12.5px; font-weight: 600; fill: #FFFFFF; }
      .step   { font-size: 11.5px; fill: #E2E8F0; }
      .glyph  { fill: none; stroke: #FFFFFF; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1100" height="640" rx="18" fill="#0F172A"/>

  <!-- ====================== you ====================== -->
  <g transform="translate(95,130)">
    <rect width="70" height="52" rx="7" fill="#334155"/>
    <rect x="6" y="6" width="58" height="8" rx="2" fill="#CBD5E1"/>
    <circle cx="11" cy="10" r="2" fill="#F87171"/><circle cx="17" cy="10" r="2" fill="#FBBF24"/><circle cx="23" cy="10" r="2" fill="#34D399"/>
    <rect x="6" y="18" width="58" height="28" rx="2" fill="#E2E8F0"/>
    <rect x="11" y="23" width="9" height="9" fill="#2E9E44"/><rect x="22" y="23" width="9" height="9" fill="#2E9E44"/><rect x="33" y="23" width="9" height="9" fill="#E53935"/>
    <rect x="11" y="34" width="9" height="9" fill="#2E9E44"/><rect x="22" y="34" width="9" height="9" fill="#F06292"/><rect x="33" y="34" width="9" height="9" fill="#7CD635"/>
    <text x="35" y="72" text-anchor="middle" class="label">Browser</text>
    <text x="35" y="88" text-anchor="middle" class="sub">Airflow-style console</text>
  </g>
  <g transform="translate(70,382)">
    <rect width="120" height="56" rx="7" fill="#334155"/>
    <text x="12" y="22" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#86EFAC">$ aws s3 cp</text>
    <text x="12" y="40" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#E2E8F0">  my_dag.py</text>
    <text x="60" y="76" text-anchor="middle" class="label">DAG files</text>
    <text x="60" y="92" text-anchor="middle" class="sub">Airflow 3 Python, unchanged</text>
  </g>

  <!-- ====================== lambdaflow ====================== -->
  <rect x="270" y="30" width="800" height="575" rx="12" class="group" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="290" y="60" class="gtitle" font-size="18" fill="#F8FAFC">lambdaflow: a serverless Airflow</text>
  <text x="290" y="78" class="sub">created once by Terraform · DAGs, runs and schedules managed in the console · ≈ $0 when idle</text>

  <!-- console -->
  <g transform="translate(320,112)">
    <rect width="86" height="86" rx="10" fill="url(#gConsole)"/>
    <text x="43" y="60" text-anchor="middle" font-size="48" font-weight="700" fill="#FFFFFF">λ</text>
    <text x="43" y="106" text-anchor="middle" class="label">Lambda: console</text>
    <text x="43" y="121" text-anchor="middle" class="sub">Function URL · API · S3 events</text>
  </g>
  <!-- scheduler -->
  <g transform="translate(560,112)">
    <rect width="86" height="86" rx="10" fill="url(#gFlow)"/>
    <circle cx="43" cy="43" r="24" class="glyph"/>
    <path d="M43 27 V43 L54 50" class="glyph"/>
    <text x="43" y="106" text-anchor="middle" class="label">EventBridge Scheduler</text>
    <text x="43" y="121" text-anchor="middle" class="sub">one schedule per DAG</text>
  </g>
  <!-- step functions -->
  <g transform="translate(800,112)">
    <rect width="86" height="86" rx="10" fill="url(#gFlow)"/>
    <rect x="31" y="14" width="24" height="14" rx="3" class="glyph" stroke-width="2.2"/>
    <rect x="14" y="58" width="22" height="14" rx="3" class="glyph" stroke-width="2.2"/>
    <rect x="50" y="58" width="22" height="14" rx="3" class="glyph" stroke-width="2.2"/>
    <path d="M43 28 V40 M25 58 V46 H61 V58" class="glyph" stroke-width="2.2"/>
    <text x="43" y="106" text-anchor="middle" class="label">Step Functions</text>
    <text x="43" y="121" text-anchor="middle" class="sub">one generic state machine</text>
  </g>
  <!-- worker -->
  <g transform="translate(800,372)">
    <rect width="86" height="86" rx="10" fill="url(#gCompute)"/>
    <text x="43" y="60" text-anchor="middle" font-size="48" font-weight="700" fill="#FFFFFF">λ</text>
    <text x="43" y="106" text-anchor="middle" class="label">Lambda: worker</text>
    <text x="43" y="121" text-anchor="middle" class="sub">parses DAGs · runs tasks</text>
    <text x="43" y="135" text-anchor="middle" class="sub">low privilege + task policies</text>
  </g>
  <!-- dynamodb -->
  <g transform="translate(560,372)">
    <rect width="86" height="86" rx="10" fill="url(#gDb)"/>
    <ellipse cx="43" cy="24" rx="22" ry="8" class="glyph"/>
    <path d="M21 24 V62 C21 72 65 72 65 62 V24 M21 43 C21 53 65 53 65 43" class="glyph"/>
    <text x="43" y="106" text-anchor="middle" class="label">DynamoDB</text>
    <text x="43" y="121" text-anchor="middle" class="sub">DAGs · runs · task instances</text>
    <text x="43" y="135" text-anchor="middle" class="sub">XComs · conditional writes</text>
  </g>
  <!-- s3 -->
  <g transform="translate(320,372)">
    <rect width="86" height="86" rx="10" fill="url(#gStorage)"/>
    <path d="M22 26 L64 26 L58 66 C56 72 30 72 28 66 Z" class="glyph"/>
    <ellipse cx="43" cy="26" rx="21" ry="7" class="glyph"/>
    <text x="43" y="106" text-anchor="middle" class="label">S3</text>
    <text x="43" y="121" text-anchor="middle" class="sub">dags/ (as in MWAA) · logs/</text>
  </g>

  <!-- edges -->
  <path d="M165 156 L 316 156" class="edge" marker-end="url(#arrow)"/>
  <path d="M190 410 L 316 410" class="edge" marker-end="url(#arrow)"/>
  <path d="M352 370 L 352 238" class="edge" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="362" y="300" class="sub">S3 event: parse</text>
  <path d="M410 145 L 556 145" class="edge" marker-end="url(#arrow)"/>
  <path d="M650 145 L 796 145" class="edge" marker-end="url(#arrow)"/>
  <path d="M410 190 C 560 300, 720 290, 795 186" class="edge" marker-end="url(#arrow)"/>
  <path d="M843 202 L 843 368" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path d="M796 415 L 650 415" class="edge" marker-end="url(#arrow)"/>
  <path d="M395 240 L 572 368" class="edge" marker-end="url(#arrow)"/>
  <path d="M797 432 C 735 432, 725 545, 640 545 L 520 545 C 470 545, 470 460, 412 432" class="edge" marker-end="url(#arrow)"/>

  <!-- callouts -->
  <rect x="425" y="118" width="22" height="22" rx="4" class="callout"/><text x="436" y="134" text-anchor="middle" class="callout-text">1</text>
  <text x="452" y="134" class="step">creates</text>
  <rect x="665" y="118" width="22" height="22" rx="4" class="callout"/><text x="676" y="134" text-anchor="middle" class="callout-text">2</text>
  <text x="692" y="134" class="step">fires</text>
  <rect x="560" y="284" width="22" height="22" rx="4" class="callout"/><text x="571" y="300" text-anchor="middle" class="callout-text">3</text>
  <text x="587" y="300" class="step">trigger · clear</text>
  <rect x="855" y="262" width="22" height="22" rx="4" class="callout"/><text x="866" y="278" text-anchor="middle" class="callout-text">4</text>
  <text x="882" y="270" class="step">step → run tasks (Map)</text>
  <text x="882" y="286" class="step">→ wait → step …</text>
  <rect x="680" y="392" width="22" height="22" rx="4" class="callout"/><text x="691" y="408" text-anchor="middle" class="callout-text">5</text>
  <text x="664" y="436" class="step">claims · states · XCom</text>
  <text x="590" y="568" text-anchor="middle" class="step">worker reads DAG files · writes task logs</text>

  <text x="670" y="626" text-anchor="middle" class="sub">a duplicate fire creates one run · a task runs once per try · a dead worker is a failed try</text>
</svg>
